services:
  - type: web
    name: motamakin-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /up

    envVars:
      - key: APP_NAME
        value: Mutamakin

      - key: APP_ENV
        value: staging

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        sync: false

      - key: APP_LOCALE
        value: en

      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: pgsql

      - key: DB_URL
        sync: false

      - key: CACHE_STORE
        value: database

      - key: SESSION_DRIVER
        value: database

      - key: QUEUE_CONNECTION
        value: sync

      - key: FILESYSTEM_DISK
        value: public

      - key: RUN_MIGRATIONS
        value: "true"

      - key: FRONTEND_URL
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Every deployment / preview URL of the Vercel project. Separate several patterns with |||.
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: '#^https://motamaken-front(-[a-z0-9-]+)?\.vercel\.app$#'

      # Real card payments. Set MOYASAR_SECRET_KEY (sk_...) in the dashboard, then point a Moyasar webhook at
      # https://<this service>/api/webhooks/moyasar with MOYASAR_WEBHOOK_SECRET as its secret token.
      - key: PAYMENTS_DRIVER
        value: moyasar

      - key: MOYASAR_SECRET_KEY
        sync: false

      - key: MOYASAR_WEBHOOK_SECRET
        generateValue: true

      - key: PAYMENTS_WEBHOOK_SECRET
        generateValue: true

      - key: MAIL_MAILER
        value: smtp

      - key: MAIL_HOST
        sync: false

      - key: MAIL_PORT
        value: "587"

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: MAIL_FROM_ADDRESS
        sync: false

      - key: MAIL_FROM_NAME
        value: Mutamakin