services:
  - type: web
    name: motamakin-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /up

    envVars:
      - key: APP_NAME
        value: Motamakin

      - key: APP_ENV
        value: staging

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        sync: false

      - key: APP_LOCALE
        value: en

      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: pgsql

      - key: DB_URL
        sync: false

      - key: CACHE_STORE
        value: database

      - key: SESSION_DRIVER
        value: database

      - key: QUEUE_CONNECTION
        value: sync

      - key: FILESYSTEM_DISK
        value: public

      - key: RUN_MIGRATIONS
        value: "true"

      - key: FRONTEND_URL
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: LOGIN_OTP_METHODS
        value: email

      - key: PAYMENTS_DRIVER
        value: fake

      - key: PAYMENTS_WEBHOOK_SECRET
        generateValue: true

      - key: MAIL_MAILER
        value: smtp

      - key: MAIL_HOST
        sync: false

      - key: MAIL_PORT
        value: "587"

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: MAIL_FROM_ADDRESS
        sync: false

      - key: MAIL_FROM_NAME
        value: Motamakin